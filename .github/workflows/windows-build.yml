# Windows build — produces Agency Agents' NSIS installers for x64 and arm64
# on a native windows-latest (x64) runner. arm64 is cross-compiled in-OS via
# the aarch64-pc-windows-msvc target (the same trick the local VM matrix uses),
# so one runner yields both installers.
#
# Signing: the *installer* is still unsigned — no code-signing cert (EV or Azure
# Trusted Signing) yet, so Windows SmartScreen warns on first launch ("More info
# -> Run anyway"). See memory-bank/decisions.md 2026-06-16.
#
# The *updater* artifact is signed: Tauri emits `<installer>.exe.sig` with the
# minisign key in repository secrets (TAURI_SIGNING_PRIVATE_KEY / …_PASSWORD),
# and the in-app updater verifies it against the public key embedded in
# tauri.conf.json. The `.sig` is uploaded next to the installer it belongs to —
# without it no `windows-x86_64` / `windows-aarch64` entry can be built into
# `latest.json`. See docs/updater-release.md.
#
# Output: the x64 + arm64 NSIS `.exe` installers and their `.sig` files, either
# as workflow artifacts (manual run) or attached to the draft GitHub Release
# created by release-please (`upload_release: true` from release-please.yml).
# The draft is published by a human, never here.

name: Windows Build

on:
  workflow_dispatch:
    inputs:
      upload_release:
        description: "Attach the installers to an existing GitHub Release"
        type: boolean
        default: false
      tag:
        description: "Release tag to attach to (e.g. v0.7.0)"
        type: string
        required: false
  workflow_call:
    inputs:
      upload_release:
        type: boolean
        default: false
      tag:
        type: string
        required: false
    # Declared explicitly (not `secrets: inherit`) so a caller cannot silently
    # run an unsigned build. Not marked `required` so an unset repository secret
    # fails in the preflight below with an actionable message rather than a bare
    # "secret not provided" from the workflow engine.
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: false
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: false

permissions:
  contents: write

jobs:
  build:
    name: Build Windows installers (x64 + arm64, unsigned)
    runs-on: windows-latest

    # Tauri reads both vars itself when signing the updater artifacts. Values
    # are never echoed; the preflight only checks presence.
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive

      # Fail before a ~20-minute MSVC build: Tauri only notices the missing key
      # when it signs, and an installer whose update payload cannot be verified
      # is worse than no build at all.
      - name: Preflight — updater signing key present
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is empty. Add the minisign private key as a repository secret (Settings > Secrets and variables > Actions) — see docs/updater-release.md."
            exit 1
          fi

      - name: Install Rust stable (+ arm64 target)
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable
          targets: aarch64-pc-windows-msvc

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      # x64 (native). createUpdaterArtifacts is true in tauri.conf.json, so the
      # installer is followed by its `.exe.sig`; no --config override — that
      # override is what used to suppress the updater artifact entirely.
      - name: Build x64 installer
        shell: bash
        run: npm run tauri build -- --target x86_64-pc-windows-msvc

      # arm64 (cross-compiled in-OS). The frontend is already built; this just
      # recompiles the Rust binary for arm64 and bundles its NSIS installer.
      - name: Build arm64 installer
        shell: bash
        run: npm run tauri build -- --target aarch64-pc-windows-msvc

      # Installer + signature are uploaded as one artifact: the manifest build
      # needs both halves, and a `.sig` without its `.exe` is unusable.
      - name: Upload x64 installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: agency-agents-windows-x64
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe.sig
          if-no-files-found: error

      - name: Upload arm64 installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: agency-agents-windows-arm64
          path: |
            src-tauri/target/aarch64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
            src-tauri/target/aarch64-pc-windows-msvc/release/bundle/nsis/*-setup.exe.sig
          if-no-files-found: error

      # Attach to the existing release without changing its draft state.
      - name: Attach to GitHub Release
        if: ${{ inputs.upload_release == true }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload "${{ inputs.tag }}" \
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe \
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe.sig \
            src-tauri/target/aarch64-pc-windows-msvc/release/bundle/nsis/*-setup.exe \
            src-tauri/target/aarch64-pc-windows-msvc/release/bundle/nsis/*-setup.exe.sig \
            --clobber
