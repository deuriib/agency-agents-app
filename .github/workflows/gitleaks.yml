# Secret scanning with gitleaks, using the repository's .gitleaks.toml
# (default ruleset + documented allowlists).
#
# Runs on every pull request, plus a weekly full-history sweep so a secret that
# landed before this workflow existed is still detected.
#
# `push: [main]` was removed in issue #90: it re-scanned the commits the PR run had
# just scanned, on the same tree. That is only safe because `gitleaks` is one of the
# required checks in the `main: PR gate` ruleset — without that, a secret reaching
# `main` would go unseen until the Monday cron, i.e. after it is in the history.
# The schedule stays for exactly that reason: it is the sweep, not the gate.

name: Secret Scan

on:
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
