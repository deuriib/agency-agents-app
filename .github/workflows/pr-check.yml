# Continuous integration for every pull request, plus a seconds-long post-merge
# canary on every push to main.
#
# Jobs are deliberately split so a fast failure does not wait for a full
# dependency build:
#   - rust-fmt     seconds, no system libraries
#   - rust-lint    rustfmt + clippy (compiles the crate, needs Tauri libs)
#   - cargo-lock   Cargo.toml and Cargo.lock agree (`--locked`)
#   - rust-test    the Rust suite (lib + integration tests)
#   - frontend     svelte-check + production build
#   - scripts      the Node script tests (bump-version fallback)
#   - vendor       the embedded contracts/baselines match the pinned submodules
#   - pr-title     Conventional Commits, the input release-please parses
#
# All jobs run on ubuntu-24.04 to match the Linux release bundle runner (see
# linux-build.yml).
#
# ## Why three jobs are `pull_request`-only (issue #90)
#
# This workflow used to run the whole graph on both events, so every merge
# repeated it on a tree that had just been tested. The three jobs that compile or
# install — `rust-lint`, `rust-test`, `frontend` — are now `pull_request`-only.
# The four that only read manifests and pinned artifacts (`rust-fmt`, `cargo-lock`,
# `scripts`, `vendor`) keep running after a merge, as the canary.
#
# That split is only sound while `main` is gated, and it is: the `main: PR gate`
# ruleset requires all nine checks (these eight plus `gitleaks`) together with
# `strict_required_status_checks_policy`, so a PR behind `main` cannot merge; the
# repository is squash-only (`allow_merge_commit` and `allow_rebase_merge` are
# off). A squash of an up-to-date head is tree-identical to the head CI already
# tested — same code, new SHA — so re-running the compile jobs on the merge commit
# cannot produce a different verdict. `CONTRIBUTING.md#main-is-gated` records the
# rule; read it before adding a trigger back "for safety".
#
# The canary is not decoration. It is the only thing watching `main` for a commit
# that arrived without passing the gate — a ruleset edit, a restored ref — and it
# fails in seconds rather than at the next release. A job added below without an
# `if:` just runs on both events, which is the old, safe behaviour, not a broken
# one.

name: PR Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-check-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust-fmt:
    name: Rust formatting (cargo fmt --check)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive

      - name: Install Rust stable (+ rustfmt)
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable
          components: rustfmt

      - name: cargo fmt --check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

  rust-lint:
    name: Rust clippy (-D warnings)
    # Compiles the crate, so it is pull-request only. See the header (issue #90).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      - name: Install Rust stable (+ clippy)
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable
          components: clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - name: cargo clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

  cargo-lock:
    name: Cargo.lock matches Cargo.toml
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable

      # `--locked` fails exactly when the lockfile would have to change, which is
      # what a release bump without a lock sync looks like. It needs no compile:
      # `cargo metadata` only reads the manifests.
      - name: cargo metadata --locked
        run: cargo metadata --manifest-path src-tauri/Cargo.toml --locked --format-version 1 > /dev/null

  rust-test:
    name: Rust tests
    # Compiles and runs the suite, so it is pull-request only (issue #90).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      # The Homebrew integration test needs macOS + a real brew; it is
      # `#[ignore]`d upstream and is not run here.
      - name: cargo test
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib --tests

  frontend:
    name: Frontend (svelte-check + build)
    # Runs `npm ci` and a production build, so it is pull-request only (issue #90).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive

      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: svelte-check
        run: npm run check

      # Unit + component tests for the stores and the Rules workspace. jsdom,
      # stubbed IPC, no Tauri runtime and no network (issue #62).
      - name: Frontend tests (Vitest)
        run: npm test

      - name: Build frontend
        run: npm run build

  scripts:
    name: Script tests (node --test)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive

      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: node --test
        run: npm run test:scripts

  vendor:
    name: Pinned catalog artifacts (sync-vendor --check)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive

      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      # The embedded contracts and bundled baselines are generated from the
      # pinned submodules (issue #72). A stale copy is a silent content drift,
      # so the check runs before anything compiles.
      - name: sync-vendor --check
        run: node scripts/sync-vendor.mjs --check

  pr-title:
    name: PR title (Conventional Commits)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The subject "{subject}" should start with a lowercase letter and be
            written in the imperative mood, e.g. "add tool registry schema".
