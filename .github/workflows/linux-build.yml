# Linux build — produces Agency Agents' .deb / .rpm / .AppImage bundles on a
# native x86_64 runner (no emulation, so the AppImage bundler works cleanly).
#
# Tauri 2 builds all three Linux bundle targets via `npm run tauri build`
# (which runs the SvelteKit frontend build first via beforeBuildCommand).
#
# Signing: Linux desktop has no code-signing requirement — the AppImage ships
# unsigned (the common convention); .deb/.rpm GPG signing is a future optional
# step. The *updater* artifact IS signed though: Tauri's minisign key lives in
# repository secrets (TAURI_SIGNING_PRIVATE_KEY / …_PASSWORD) and every bundle
# this job produces carries a `.sig` the in-app updater verifies against the
# public key embedded in tauri.conf.json. See docs/updater-release.md.
#
# Updater artifact: this is the subtle part. Tauri emits
# `<name>.AppImage.tar.gz` + `.sig` at bundle time, but the AppImage is repacked
# AFTER that to un-bundle host Wayland libs (#57) — shipping Tauri's tarball
# would hand every Linux user the crashing AppImage. So the tarball is deleted
# and regenerated from the *repacked* AppImage, then signed again.
#
# Output: .deb / .rpm / .AppImage, the updater `.AppImage.tar.gz` + `.sig`,
# either as workflow artifacts (manual run) or attached to the draft GitHub
# Release created by release-please (`upload_release: true` from
# release-please.yml). The draft is published by a human, never here.

name: Linux Build

on:
  workflow_dispatch:
    inputs:
      upload_release:
        description: "Attach the bundles to an existing GitHub Release"
        type: boolean
        default: false
      tag:
        description: "Release tag to attach to (e.g. v0.7.0)"
        type: string
        required: false
  workflow_call:
    inputs:
      upload_release:
        type: boolean
        default: false
      tag:
        type: string
        required: false
    # Declared explicitly (not `secrets: inherit`) so a caller cannot silently
    # run an unsigned build: the caller in release-please.yml passes both. They
    # are not marked `required` because an unset repository secret then fails in
    # the preflight below with an actionable message instead of a bare
    # "secret not provided" from the workflow engine.
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: false
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: false

permissions:
  contents: write

jobs:
  build:
    name: Build Linux bundles (.deb / .rpm / .AppImage)
    # Ubuntu 24.04 (Noble, webkit2gtk-4.1). These bundles support 24.04+
    # (glibc 2.39+). Lower this runner only if Ubuntu 22.04 compatibility is a
    # hard requirement — that raises the floor for every user downstream.
    runs-on: ubuntu-24.04

    # Tauri reads both vars itself when signing updater artifacts, and the
    # explicit post-repack `tauri signer sign` below uses them too. Values are
    # never echoed; the preflight only checks presence.
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive

      # Fail in ~2 seconds instead of after a 20-minute compile: Tauri only
      # discovers a missing key when it signs, and by then the whole build is
      # wasted. An unsigned updater artifact is worse than no build at all —
      # the app would offer an update it cannot verify and refuse it.
      - name: Preflight — updater signing key present
        run: |
          set -euo pipefail
          if [[ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is empty. Add the minisign private key as a repository secret (Settings > Secrets and variables > Actions) — see docs/updater-release.md."
            exit 1
          fi

      # The ubuntu-24.04 runner image runs with umask 0077, so checkout
      # materializes files as 0600/0700. appimagetool refuses to package an
      # AppDir whose files are not world-readable (and the bundled app would
      # be unusable for other users), so normalize the tree before anything
      # is copied into the bundle. New artefacts are created under umask 0022
      # in the build steps below.
      - name: Normalize checkout permissions (umask 0077 on 24.04)
        run: chmod -R a+rX .

      # Standard Tauri 2 Linux build deps (https://v2.tauri.app/start/prerequisites/)
      # plus patchelf/file/wget for the AppImage bundler, and the xdg-utils +
      # gtk/rsvg helpers the AppImage GTK plugin shells out to.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            build-essential \
            file \
            wget \
            xdg-utils \
            librsvg2-bin \
            libgtk-3-bin

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      # Builds the frontend, compiles the Rust binary, and bundles
      # .deb / .rpm / .AppImage plus the signed `<name>.AppImage.tar.gz` updater
      # artifact. createUpdaterArtifacts is true in tauri.conf.json; no
      # --config override here — overriding it is what left every release
      # without a `.sig` and made the in-app updater report "up to date".
      - name: Build Tauri app
        run: |
          umask 0022
          npm run tauri build

      # Un-bundle the Wayland client libs from the AppImage (#57).
      #
      # linuxdeploy bundles libwebkit2gtk's transitive libwayland-* into the
      # AppImage. Those are built against an older Mesa than the *host* is
      # running, so when libEGL_mesa initializes the Wayland platform it hits a
      # protocol/ABI mismatch and aborts with "Could not create default EGL
      # display: EGL_BAD_PARAMETER" — the webview never appears. The failure is
      # in EGL display init, BEFORE WebKit reads WEBKIT_DISABLE_DMABUF_RENDERER
      # (our lib.rs runtime lever, #641/#36), which is why no env var can fix it.
      #
      # libwayland (like libGL/libEGL/libgbm/libdrm, which linuxdeploy already
      # excludes) MUST come from the running system to match the loaded EGL
      # stack. So strip the four bundled copies and repack — the host's copies
      # then load. Only the AppImage bundles libs; .deb/.rpm link system libwayland.
      - name: "Un-bundle host Wayland libs from AppImage (fixes EGL crash, #57)"
        run: |
          set -euo pipefail
          umask 0022
          cd src-tauri/target/release/bundle/appimage
          APP="$(ls *.AppImage)"
          # Tauri's tarball was made from the AppImage as it was BEFORE the
          # repack below, i.e. the crashing one. Drop it here so it can never be
          # uploaded by accident; the next step rebuilds it from the fixed file.
          rm -f "$APP.tar.gz" "$APP.tar.gz.sig"
          echo "Repacking $APP without bundled libwayland-*"
          ./"$APP" --appimage-extract >/dev/null
          # The AppImage runtime extracts with restrictive modes (0700/0770)
          # regardless of the caller's umask, and appimagetool refuses to
          # repack an AppDir that is not world-readable.
          chmod -R a+rX squashfs-root
          find squashfs-root -type f \( \
              -name 'libwayland-client.so.*' -o \
              -name 'libwayland-cursor.so.*' -o \
              -name 'libwayland-egl.so.*' -o \
              -name 'libwayland-server.so.*' \) -print -delete
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run squashfs-root "$APP.new"
          mv -f "$APP.new" "$APP"
          # appimagetool's output mode depends on the umask it inherited; pin
          # 0755 so both the AppImage and the tarball built from it are
          # executable for every user after extraction.
          chmod +x "$APP"
          rm -rf squashfs-root appimagetool
          echo "Done — $APP now defers libwayland to the host."

      # Rebuild the updater artifact from the REPACKED AppImage and sign it
      # again. Same shape Tauri produces (a gzipped tar holding the AppImage at
      # the archive root) so the plugin's extractor is unchanged; only the bytes
      # differ, which is exactly why the signature has to be regenerated.
      - name: Regenerate + sign the updater tarball
        run: |
          set -euo pipefail
          umask 0022
          cd src-tauri/target/release/bundle/appimage
          APP="$(ls *.AppImage)"
          tar -czf "$APP.tar.gz" "$APP"
          rm -f "$APP.tar.gz.sig"
          # The key comes from the job env (TAURI_SIGNING_PRIVATE_KEY /
          # …_PASSWORD), never argv: a command-line argument is visible to every
          # process on the runner, while the environment is already how Tauri's
          # build step receives it. Same reason the docs tell humans to export it.
          npx --no-install tauri signer sign "$APP.tar.gz"
          test -s "$APP.tar.gz.sig" || { echo "::error::updater tarball was not signed"; exit 1; }
          ls -l "$APP.tar.gz" "$APP.tar.gz.sig"

      - name: Upload .deb
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: agency-agents-deb
          path: src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

      - name: Upload .rpm
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: agency-agents-rpm
          path: src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: error

      - name: Upload .AppImage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: agency-agents-appimage
          path: src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

      # The updater artifact and its signature travel together: a `.tar.gz`
      # without `.sig` fails the manifest build (the CLI rejects an empty
      # signature) and a `.sig` without the tarball is dead weight.
      - name: Upload updater artifact (.AppImage.tar.gz + .sig)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: agency-agents-linux-updater
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage.tar.gz
            src-tauri/target/release/bundle/appimage/*.AppImage.tar.gz.sig
          if-no-files-found: error

      # `gh release upload` attaches to the existing draft release without
      # touching its draft/published state — publishing stays a human step
      # after the macOS DMGs are attached locally.
      - name: Attach to GitHub Release
        if: ${{ inputs.upload_release == true }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload "${{ inputs.tag }}" \
            src-tauri/target/release/bundle/deb/*.deb \
            src-tauri/target/release/bundle/rpm/*.rpm \
            src-tauri/target/release/bundle/appimage/*.AppImage \
            src-tauri/target/release/bundle/appimage/*.AppImage.tar.gz \
            src-tauri/target/release/bundle/appimage/*.AppImage.tar.gz.sig \
            --clobber
