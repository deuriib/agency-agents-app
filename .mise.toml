# mise — one source of truth for the toolchain and the developer tasks.
#
#   mise install       # node + rust at the versions pinned in mise.lock
#   mise run setup     # toolchain + npm dependencies
#   mise run ci        # exactly what .github/workflows/pr-check.yml runs
#   mise tasks         # list everything
#
# Task names use hyphens (`fmt-check`, not `fmt:check`): a colon is not a valid
# TOML bare key, so mise cannot parse it.

[settings]
experimental = true
# Pin resolved tool versions (mise.lock) so every checkout and every CI run
# gets the same node/rust build. Refresh deliberately with `mise lock`.
lockfile = true

[tools]
node = "22"
# Pinned explicitly: mise's global config otherwise injects a newer npm whose
# engine range can exceed the pinned Node 22 (npm 12 warns on Node 22.19).
# Node 22 ships npm 10, and package-lock.json is lockfileVersion 3.
npm = "10"
rust = "stable"

[env]
# Per-developer overrides (never committed). Release signing secrets are not
# env vars here: `scripts/release.sh` reads them from the macOS Keychain.
_.file = ".env"

# ── Setup ─────────────────────────────────────────────────────────────────────

[tasks.setup]
description = "Install npm dependencies from the lockfile"
run = "npm ci"

# ── Static checks (mirror .github/workflows/pr-check.yml) ────────────────────

[tasks.fmt]
description = "Format the Rust crate with rustfmt"
dir = "src-tauri"
run = "cargo fmt"

[tasks.fmt-check]
description = "Verify Rust formatting — CI job: rust-fmt"
dir = "src-tauri"
run = "cargo fmt --check"

[tasks.check-lock]
description = "Verify Cargo.lock matches Cargo.toml — CI job: cargo-lock"
run = "cargo metadata --manifest-path src-tauri/Cargo.toml --locked --format-version 1 > /dev/null"

[tasks.sync-lock]
description = "Rewrite the Cargo.lock package entry after a version bump"
run = "cargo metadata --manifest-path src-tauri/Cargo.toml --format-version 1 > /dev/null"

[tasks.clippy]
description = "Lint the Rust crate, warnings as errors — CI job: rust-lint"
dir = "src-tauri"
run = "cargo clippy --all-targets -- -D warnings"

[tasks.check]
description = "Type-check the SvelteKit frontend — CI job: frontend"
run = "npm run check"

[tasks.test-ui]
description = "Run the frontend unit + component tests (Vitest, jsdom) — CI job: frontend"
run = "npm test"

[tasks.lint]
description = "All static checks (fmt, clippy, svelte-check)"
depends = ["fmt-check", "clippy", "check"]

# ── Tests (mirror .github/workflows/pr-check.yml) ────────────────────────────

[tasks.test-rust]
description = "Run the Rust suite — CI job: rust-test"
dir = "src-tauri"
run = "cargo test --lib --tests"

[tasks.test-scripts]
description = "Run the Node script tests — CI job: scripts"
run = "npm run test:scripts"

[tasks.test]
description = "Run every test suite"
depends = ["test-rust", "test-scripts", "test-ui"]

[tasks.sync-vendor]
description = "Regenerate the embedded contracts and baselines from the pinned submodules"
run = "node scripts/sync-vendor.mjs"

[tasks.check-vendor]
description = "Verify the contracts and baselines match the pinned submodules"
run = "node scripts/sync-vendor.mjs --check"

[tasks.submodules]
description = "Fetch the pinned catalog and rule submodules"
run = "git submodule update --init --recursive"

[tasks.ci]
description = "Reproduce the full PR Check workflow locally"
depends = ["check-vendor", "fmt-check", "clippy", "check-lock", "test-rust", "test-scripts", "test-ui", "check", "build-frontend"]

# ── Build and run ────────────────────────────────────────────────────────────

[tasks.build-frontend]
description = "Production frontend build — CI job: frontend"
run = "npm run build"

[tasks.dev]
description = "Run the app with hot reload (Tauri dev)"
run = "npm run tauri dev"

[tasks.build]
description = "Build the app for the host platform"
run = "npm run tauri build"

[tasks.tauri]
description = "Pass arguments to the Tauri CLI (mise run tauri -- info)"
run = "npm run tauri --"

# ── Optional gates ───────────────────────────────────────────────────────────

[tasks.parity]
description = "Renderer parity test against the pinned catalog submodule (defaults to vendor/agency-agents)"
dir = "src-tauri"
run = "cargo test upstream_convert_sh_is_byte_identical_for_transform_tools -- --ignored"

# ── Updater operations ───────────────────────────────────────────────────────

# Validates the manifest a client would actually fetch. Defaults to the stable
# channel and all five platform keys; pass --channel beta, --file, --url,
# --allow-subset or --check-urls after `--`.
[tasks.verify-updater]
description = "Validate the published updater manifest (stable by default)"
run = "node scripts/verify-updater-manifest.mjs"

# Reads the key from the macOS Keychain (or --key-file), refuses it if its id
# does not match the embedded pubkey, and pipes both values to `gh secret set`
# without echoing them.
[tasks.set-updater-secrets]
description = "Upload the updater signing key to GitHub Actions secrets"
run = "bash scripts/set-updater-secrets.sh"
